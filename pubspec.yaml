name: iti_grad_proj
description: "AURA — Discover the world's most popular people."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # Dependency Injection
  provider: ^6.1.2

  # Networking
  dio: ^5.9.0

  # State Management
  flutter_bloc: ^8.1.6

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Fonts
  google_fonts: ^6.2.1

  # Image handling
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Shimmer skeleton loading
  shimmer: ^3.0.0

  # Generative AI (Gemini)
  google_generative_ai: ^0.4.7

  # Environment variables
  flutter_dotenv: ^5.2.1

  # Favorites persistence
  shared_preferences: ^2.3.5

  # Permissions + file download
  permission_handler: ^11.3.1
  path_provider: ^2.1.5

  # Chat message IDs
  uuid: ^4.5.1
  gal: ^2.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
